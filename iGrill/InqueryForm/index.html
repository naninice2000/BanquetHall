<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banquet Hall Availability | iGrill</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #c59d5f;
      --primary-hover: #b08947;
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --bg-surface: #f3f4f6;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --border-dark: #d1d5db;
      --available: #2e7d32;
      --available-hover: #388e3c;
      --booked: #d32f2f;
      --past-date: #e5e7eb;
      --past-text: #9ca3af;
      --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      font-size: 15px;
      padding: 2.5rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .header-section {
      text-align: center;
      margin-bottom: 2.2rem;
    }

    .header-badge {
      display: inline-block;
      background: #fdf8f0;
      color: var(--primary);
      border: 1px solid rgba(197, 157, 95, 0.35);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.85rem;
      border-radius: 20px;
      margin-bottom: 0.6rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-section h1 {
      color: var(--text-main);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 0.5rem;
    }

    .title-divider {
      width: 45px;
      height: 3px;
      background-color: var(--primary);
      margin: 0 auto 0.75rem auto;
      border-radius: 2px;
    }

    .header-section p {
      color: var(--text-muted);
      font-size: 0.92rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    .legend-box.green { background-color: var(--available); }
    .legend-box.red { background-color: var(--booked); }
    .legend-box.gray { background-color: var(--past-date); border: 1px solid var(--border-dark); }

    .calendar-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .calendar-nav h2 {
      font-size: 1.25rem;
      color: var(--text-main);
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .btn-nav {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-dark);
      padding: 0.45rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .btn-nav:hover {
      background: #e5e7eb;
      border-color: var(--primary);
      color: var(--primary);
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.8rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .day-cell.empty {
      background: transparent;
      border-color: transparent;
    }

    .day-cell.past-cell {
      background-color: var(--past-date);
      border-color: #e5e7eb;
      cursor: not-allowed;
    }

    .day-number {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 5;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .past-cell .day-number {
      color: var(--past-text);
      text-shadow: none;
    }

    .slot-triangle {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: filter 0.2s;
    }

    .slot-lunch {
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .slot-dinner {
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .slot-triangle.available {
      background-color: var(--available);
      cursor: pointer;
    }

    .slot-triangle.available:hover {
      background-color: var(--available-hover);
      filter: brightness(1.15);
    }

    .slot-triangle.booked {
      background-color: var(--booked);
      cursor: not-allowed;
    }

    .slot-triangle.selected {
      outline: 2px solid #000000;
      z-index: 4;
      filter: brightness(1.25);
    }

    .slot-triangle.disabled-past {
      background-color: var(--past-date);
      cursor: not-allowed;
    }

    .form-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .selection-banner {
      background: #fdf8f0;
      border-left: 4px solid var(--primary);
      padding: 1rem 1.2rem;
      margin-bottom: 1.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    .form-group {
      margin-bottom: 1.3rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(197, 157, 95, 0.2);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      padding: 0.95rem;
      border-radius: 4px;
      font-family: var(--font-family);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(197, 157, 95, 0.3);
    }

    .btn-submit:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    #hidden_iframe {
      display: none;
    }

    @media (max-width: 600px) {
      .form-grid-2 { grid-template-columns: 1fr; }
      .header-section h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <span class="header-badge">Online Reservations</span>
      <h1>Banquet Hall Availability</h1>
      <div class="title-divider"></div>
      <p>Click any green slot for a future date (Top = Lunch, Bottom = Dinner) to submit an inquiry.</p>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-box green"></div>
        <span>Open / Available</span>
      </div>
      <div class="legend-item">
        <div class="legend-box red"></div>
        <span>Booked / TempHold</span>
      </div>
      <div class="legend-item">
        <div class="legend-box gray"></div>
        <span>Past / Today (Unavailable)</span>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-nav">
        <button class="btn-nav" id="prev-month">&larr; Prev</button>
        <h2 id="calendar-title">Month Year</h2>
        <button class="btn-nav" id="next-month">Next &rarr;</button>
      </div>

      <div class="weekdays-grid">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="days-grid" id="calendar-days"></div>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

    <div class="form-card" id="inquiry-form-wrapper">
      <div class="selection-banner" id="selected-slot-text">
        Selected Slot: None
      </div>

      <form id="banquet-form" method="GET" target="hidden_iframe" onsubmit="handleFormSubmit(event)">
        <input type="hidden" name="action" value="submitInquiry" />
        <input type="hidden" id="selected-date" name="date" required />
        <input type="hidden" id="selected-slot" name="slot" required />

        <div class="form-grid-2">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter full name" />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required placeholder="(669) 000-0000" />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com" />
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="adultGuests">Estimated Adult Guest Count *</label>
            <input type="number" id="adultGuests" name="adultGuests" min="10" max="300" placeholder="e.g. 50" required />
          </div>
          <div class="form-group">
            <label for="kidsGuests">Estimated Kids Guest Count (3+ age)</label>
            <input type="number" id="kidsGuests" name="kidsGuests" min="0" max="150" placeholder="e.g. 10" value="0" />
          </div>
        </div>

        <div class="form-group">
          <label for="eventType">Event Type</label>
          <select id="eventType" name="eventType">
            <option value="Birthday / Anniversary">Birthday / Anniversary</option>
            <option value="Wedding / Reception">Wedding / Reception</option>
            <option value="Corporate Event">Corporate Event</option>
            <option value="Other Gathering">Other Gathering</option>
          </select>
        </div>

        <div class="form-group">
          <label for="notes">Additional Comments / Dietary Preferences</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Menu preferences, catering details, hall setup..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Submit Reservation Inquiry</button>
      </form>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyUB7uRn9tz5wkjzIYQDTYZ28QhDDFH6BKyIlRRSPfqOm1b43iNScaJotpdt204WaEq/exec";

    let sheetAvailability = {};
    let currentDate = new Date();
    let selectedSlotData = null;

    const calendarTitle = document.getElementById("calendar-title");
    const calendarDays = document.getElementById("calendar-days");
    const formWrapper = document.getElementById("inquiry-form-wrapper");
    const selectedSlotText = document.getElementById("selected-slot-text");
    const inputDate = document.getElementById("selected-date");
    const inputSlot = document.getElementById("selected-slot");
    const submitBtn = document.getElementById("submit-btn");
    const banquetForm = document.getElementById("banquet-form");

    banquetForm.action = APPS_SCRIPT_WEB_APP_URL;

    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    // Global callback for JSONP data load (Zero CORS issues)
    window.onAvailabilityLoaded = function(data) {
      sheetAvailability = {};
      if (Array.isArray(data)) {
        data.forEach(item => {
          const dateKey = String(item.date || '').trim();
          const slotKey = String(item.slot || '').trim();
          const isOpen = item.isOpen === true;

          if (dateKey && slotKey) {
            if (!sheetAvailability[dateKey]) {
              sheetAvailability[dateKey] = {};
            }
            sheetAvailability[dateKey][slotKey] = isOpen;
          }
        });
      }
      renderCalendar();
    };

    function loadAvailabilityData() {
      // Create a dynamic script tag (JSONP pattern)
      const oldScript = document.getElementById("jsonp_script");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "jsonp_script";
      script.src = `${APPS_SCRIPT_WEB_APP_URL}?callback=onAvailabilityLoaded&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      calendarTitle.textContent = `${months[month]} ${year}`;
      calendarDays.innerHTML = "";

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day-cell empty";
        calendarDays.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";

        const dayNum = document.createElement("div");
        dayNum.className = "day-number";
        dayNum.textContent = day;
        cell.appendChild(dayNum);

        const cellDate = new Date(year, month, day);
        cellDate.setHours(0, 0, 0, 0);

        const isPastOrCurrent = cellDate <= today;

        const formattedMonth = String(month + 1).padStart(2, "0");
        const formattedDay = String(day).padStart(2, "0");
        const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

        if (isPastOrCurrent) {
          cell.classList.add("past-cell");
          
          const pastLunch = document.createElement("div");
          pastLunch.className = "slot-triangle slot-lunch disabled-past";
          pastLunch.title = `${dateStr} - Past Date (Unavailable)`;

          const pastDinner = document.createElement("div");
          pastDinner.className = "slot-triangle slot-dinner disabled-past";
          pastDinner.title = `${dateStr} - Past Date (Unavailable)`;

          cell.appendChild(pastLunch);
          cell.appendChild(pastDinner);
        } else {
          const daySlots = sheetAvailability[dateStr] || {};
          const isLunchOpen = daySlots["Lunch"] === true;
          const isDinnerOpen = daySlots["Dinner"] === true;

          // Top-Left: Lunch
          const lunchEl = document.createElement("div");
          lunchEl.className = `slot-triangle slot-lunch ${isLunchOpen ? "available" : "booked"}`;
          lunchEl.title = `${dateStr} - Lunch: ${isLunchOpen ? "Available" : "Unavailable"}`;
          if (isLunchOpen) {
            lunchEl.addEventListener("click", () => selectSlot(dateStr, "Lunch", lunchEl));
          }

          // Bottom-Right: Dinner
          const dinnerEl = document.createElement("div");
          dinnerEl.className = `slot-triangle slot-dinner ${isDinnerOpen ? "available" : "booked"}`;
          dinnerEl.title = `${dateStr} - Dinner: ${isDinnerOpen ? "Available" : "Unavailable"}`;
          if (isDinnerOpen) {
            dinnerEl.addEventListener("click", () => selectSlot(dateStr, "Dinner", dinnerEl));
          }

          cell.appendChild(lunchEl);
          cell.appendChild(dinnerEl);
        }

        calendarDays.appendChild(cell);
      }
    }

    function selectSlot(date, slot, element) {
      document.querySelectorAll(".slot-triangle.selected").forEach(el => el.classList.remove("selected"));

      element.classList.add("selected");
      selectedSlotData = { date, slot };

      inputDate.value = date;
      inputSlot.value = slot;
      selectedSlotText.textContent = `Selected Booking: ${date} (${slot} Session)`;

      formWrapper.style.display = "block";
      formWrapper.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function handleFormSubmit(e) {
      if (!selectedSlotData) {
        e.preventDefault();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting Inquiry...";

      setTimeout(() => {
        alert("Thank you! Your inquiry has been submitted and the status has been marked as TempHold in your BOOKINGS sheet.");
        formWrapper.style.display = "none";
        banquetForm.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Reservation Inquiry";

        // Refresh data using JSONP
        setTimeout(() => {
          loadAvailabilityData();
        }, 1500);
      }, 1000);
    }

    document.getElementById("prev-month").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("next-month").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
    loadAvailabilityData();
  </script>
</body>
</html>
